rules:
  unpinned-uses:
    config:
      policies:
        # SLSA's generator must be called by tag, not commit: its own checks read the calling ref.
        slsa-framework/slsa-github-generator/*: ref-pin
  concurrency-limits:
    ignore:
      # Scorecard runs only on main, weekly and on branch protection changes, and its workflow is
      # kept to what the Scorecard API accepts for published results.
      - scorecard.yml
