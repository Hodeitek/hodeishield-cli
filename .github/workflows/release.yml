name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build archives only. A manual run never signs or publishes, whatever this says."
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: hodeishield

jobs:
  # Resolves the release version once so every job/archive name agrees on it.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - name: Determine version and mode
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
            echo "dry_run=${DRY_RUN_INPUT}" >> "$GITHUB_OUTPUT"
          else
            # REF_NAME is the pushed tag, e.g. "v0.1.0" -> "0.1.0".
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    name: build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show

      - name: Add musl target
        run: rustup target add ${{ matrix.target }}

      # musl-tools provides the musl-gcc/*-linux-musl-gcc wrapper that the
      # `cc` crate needs to compile aws-lc-sys's C sources (rustls uses
      # aws-lc-rs). No cmake/nasm is required: aws-lc-sys ships prebuilt NASM
      # objects and only invokes a plain C compiler on this target.
      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p hodeishield-cli

      - name: Package archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)/hodeishield-${VERSION}-${TARGET}"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/${BIN_NAME}" "$stage/"
          cp LICENSE README.md "$stage/"
          tar -C "$(dirname "$stage")" -czf "hodeishield-${VERSION}-${TARGET}.tar.gz" "$(basename "$stage")"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: hodeishield-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: build (universal-apple-darwin)
    needs: version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show

      - name: Add Darwin targets
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --locked --target x86_64-apple-darwin -p hodeishield-cli

      - name: Build aarch64
        run: cargo build --release --locked --target aarch64-apple-darwin -p hodeishield-cli

      - name: Combine into a universal binary
        run: |
          set -euo pipefail
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output "target/universal-apple-darwin/release/${BIN_NAME}" \
            "target/x86_64-apple-darwin/release/${BIN_NAME}" \
            "target/aarch64-apple-darwin/release/${BIN_NAME}"
          lipo -info "target/universal-apple-darwin/release/${BIN_NAME}"

      - name: Package archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: universal-apple-darwin
        run: |
          set -euo pipefail
          stage="$(mktemp -d)/hodeishield-${VERSION}-${TARGET}"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/${BIN_NAME}" "$stage/"
          cp LICENSE README.md "$stage/"
          tar -C "$(dirname "$stage")" -czf "hodeishield-${VERSION}-${TARGET}.tar.gz" "$(basename "$stage")"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-universal-apple-darwin
          path: hodeishield-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: build (x86_64-pc-windows-msvc)
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p hodeishield-cli

      - name: Package archive
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $target = "x86_64-pc-windows-msvc"
          $stageName = "hodeishield-$env:VERSION-$target"
          $stage = Join-Path $env:RUNNER_TEMP $stageName
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/$target/release/$env:BIN_NAME.exe" $stage
          Copy-Item "LICENSE" $stage
          Copy-Item "README.md" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "hodeishield-$env:VERSION-$target.zip"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-x86_64-pc-windows-msvc
          path: hodeishield-*.zip
          if-no-files-found: error
          retention-days: 7

  # Downloads every archive, hashes and keylessly signs them with cosign, and
  # opens a DRAFT GitHub release with everything attached. The owner reviews
  # and publishes the draft by hand; this job never publishes a non-draft
  # release.
  publish:
    name: publish (draft release)
    needs: [version, build-linux, build-macos, build-windows]
    # Only a pushed tag publishes; a manual run is always a dry run, whatever the ref is called.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the draft release and upload assets
      id-token: write # for cosign's Sigstore keyless (OIDC) signing
    outputs:
      subjects-b64: ${{ steps.subjects.outputs.subjects-b64 }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download all archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: List downloaded archives
        run: ls -l dist

      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Base64-encode SHA256SUMS for the provenance generator
        id: subjects
        working-directory: dist
        run: echo "subjects-b64=$(base64 -w0 < SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Keyless signing: cosign requests a short-lived certificate from
      # Fulcio using this job's GitHub OIDC token (id-token: write above) and
      # records the signature in the public Rekor transparency log. No
      # signing key or secret is used or stored anywhere.
      - name: Sign every archive and SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          for f in hodeishield-*.tar.gz hodeishield-*.zip SHA256SUMS; do
            [ -e "$f" ] || continue
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            dist/*

  # SLSA build provenance for the release archives. The generic generator's
  # `draft-release` input lets it append the signed provenance to the draft
  # release created above instead of requiring a published release.
  provenance:
    name: provenance
    needs: publish
    permissions:
      id-token: write # for the generator's own keyless signing
      contents: write # to attach the provenance file to the draft release
      actions: read
    # Pinned by tag, not SHA: the slsa-framework/slsa-github-generator docs
    # require reusable workflow callers to reference it by tag so its
    # internal integrity checks (which compare the calling ref) still work.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.publish.outputs.subjects-b64 }}
      upload-assets: true
      upload-tag-name: ${{ needs.publish.outputs.tag }}
      provenance-name: hodeishield.intoto.jsonl
      draft-release: "true"
