name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build archives only. A manual run never signs or publishes, whatever this says."
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: hodeishield

jobs:
  # Resolves the release version once so every job/archive name agrees on it.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      sign_macos: ${{ steps.signing.outputs.sign_macos }}
      sign_windows: ${{ steps.signing.outputs.sign_windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine version and mode
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
            echo "dry_run=${DRY_RUN_INPUT}" >> "$GITHUB_OUTPUT"
          else
            # REF_NAME is the pushed tag, e.g. "v0.1.0" -> "0.1.0".
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      # A tag cannot be released without its notes: fail before building anything.
      - name: Check the changelog has an entry for this version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh .github/scripts/changelog-section.sh "$VERSION" > /dev/null

      # Platform signing happens only for a pushed release tag, and only once the maintainers have
      # provisioned it and set the variable to exactly "true". A manual run never signs. GitHub's
      # comparison is case-sensitive, so "True" or "1" would silently mean "off": refuse them.
      - name: Decide platform signing
        id: signing
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
        run: |
          set -euo pipefail
          for name in MACOS_SIGNING_ENABLED WINDOWS_SIGNING_ENABLED; do
            case "${!name}" in
              ""|true|false) ;;
              *) echo "::error::$name must be exactly 'true', 'false' or unset."; exit 1 ;;
            esac
          done
          release=false
          if [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            release=true
          fi
          sign_macos=false
          sign_windows=false
          if [ "$release" = true ] && [ "$MACOS_SIGNING_ENABLED" = true ]; then sign_macos=true; fi
          if [ "$release" = true ] && [ "$WINDOWS_SIGNING_ENABLED" = true ]; then sign_windows=true; fi
          echo "sign_macos=$sign_macos" >> "$GITHUB_OUTPUT"
          echo "sign_windows=$sign_windows" >> "$GITHUB_OUTPUT"
          echo "macOS signing: $sign_macos; Windows signing: $sign_windows"

  build-linux:
    name: build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show

      - name: Add musl target
        run: rustup target add ${{ matrix.target }}

      # musl-tools provides the musl-gcc/*-linux-musl-gcc wrapper that the
      # `cc` crate needs to compile aws-lc-sys's C sources (rustls uses
      # aws-lc-rs). No cmake/nasm is required: aws-lc-sys ships prebuilt NASM
      # objects and only invokes a plain C compiler on this target.
      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p hodeishield-cli

      - name: Generate man pages
        run: cargo xtask man target/man

      - name: Package archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)/hodeishield-${VERSION}-${TARGET}"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/${BIN_NAME}" "$stage/"
          cp LICENSE NOTICE README.md "$stage/"
          mkdir -p "$stage/man"
          cp target/man/*.1 "$stage/man/"
          tar -C "$(dirname "$stage")" -czf "hodeishield-${VERSION}-${TARGET}.tar.gz" "$(basename "$stage")"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: hodeishield-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: build (universal-apple-darwin)
    needs: version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show

      - name: Add Darwin targets
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --locked --target x86_64-apple-darwin -p hodeishield-cli

      - name: Build aarch64
        run: cargo build --release --locked --target aarch64-apple-darwin -p hodeishield-cli

      - name: Combine into a universal binary
        run: |
          set -euo pipefail
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output "target/universal-apple-darwin/release/${BIN_NAME}" \
            "target/x86_64-apple-darwin/release/${BIN_NAME}" \
            "target/aarch64-apple-darwin/release/${BIN_NAME}"
          lipo -info "target/universal-apple-darwin/release/${BIN_NAME}"

      - name: Generate man pages
        run: cargo xtask man target/man

      - name: Stage the unsigned binary for the signing job
        run: |
          set -euo pipefail
          mkdir -p stage/man
          cp "target/universal-apple-darwin/release/${BIN_NAME}" LICENSE NOTICE README.md stage/
          cp target/man/*.1 stage/man/

      - name: Upload the unsigned binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-universal-apple-darwin
          path: stage/*
          if-no-files-found: error
          retention-days: 1

  # Signs, notarizes and packages the macOS binary. Split from the build on purpose: the Developer
  # ID keys and the App Store Connect key must never share a runner with `cargo build`, which runs
  # every dependency's build script. This job checks nothing out and runs no repository code, only
  # inline steps and pinned actions.
  #
  # Two artifacts when signing is on:
  # - the .tar.gz as before, with a signed and notarized binary. A bare executable cannot carry a
  #   stapled ticket, so Gatekeeper confirms its notarization online on first run; curl and
  #   scripts are unaffected (they set no quarantine attribute).
  # - a .pkg that installs /usr/local/bin/hodeishield, signed with Developer ID Installer,
  #   notarized and stapled, so it also passes Gatekeeper offline and can be deployed by MDM.
  #
  # Environment secrets (release-signing): MACOS_CERTIFICATE and MACOS_CERTIFICATE_PASSWORD
  # (Developer ID Application, base64 .p12), MACOS_SIGNING_IDENTITY, MACOS_INSTALLER_CERTIFICATE,
  # MACOS_INSTALLER_CERTIFICATE_PASSWORD, MACOS_INSTALLER_IDENTITY (Developer ID Installer),
  # APPLE_NOTARIZATION_KEY (base64 .p8), APPLE_NOTARIZATION_KEY_ID, APPLE_NOTARIZATION_ISSUER_ID.
  sign-macos:
    name: sign and package (universal-apple-darwin)
    needs: [version, build-macos]
    runs-on: macos-latest
    timeout-minutes: 60
    # The environment, and its required reviewer, only when this run signs. An empty name means
    # no environment, so a dry run never waits for approval.
    environment: ${{ needs.version.outputs.sign_macos == 'true' && 'release-signing' || '' }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: universal-apple-darwin
      SIGN: ${{ needs.version.outputs.sign_macos }}
    steps:
      - name: Download the unsigned binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-universal-apple-darwin
          path: stage

      # Anything else in the hand-off would be packaged, and possibly signed, as ours.
      - name: Refuse anything but the expected files
        run: |
          set -euo pipefail
          # Top level: exactly the binary, the licence files and the README, plus `man/`. In `man/`:
          # only regular `hodeishield*.1` files, at least one. Nothing else, of any type.
          top="$(cd stage && find . -mindepth 1 -maxdepth 1 | sed 's|^\./||' | LC_ALL=C sort | tr '\n' ' ')"
          if [ "$top" != "LICENSE NOTICE README.md hodeishield man " ]; then
            echo "::error::Unexpected hand-off contents: $top"
            exit 1
          fi
          if [ -n "$(find stage -mindepth 1 -maxdepth 1 ! -type f ! -name man)" ] || [ ! -d stage/man ] || [ -L stage/man ]; then
            echo "::error::The hand-off holds something that is not a regular file."
            exit 1
          fi
          odd="$(find stage/man -mindepth 1 \( ! -type f -o ! -name 'hodeishield*.1' \))"
          pages="$(find stage/man -mindepth 1 -type f -name 'hodeishield*.1' | wc -l)"
          if [ -n "$odd" ] || [ "$pages" -lt 1 ]; then
            echo "::error::man/ must hold only hodeishield*.1 files (found $pages pages; unexpected: $odd)"
            exit 1
          fi
          chmod 0755 "stage/${BIN_NAME}"
          find stage/man -type f -exec chmod 0644 {} \;

      - name: Check the signing inputs are present
        if: env.SIGN == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY \
                      MACOS_INSTALLER_CERTIFICATE MACOS_INSTALLER_CERTIFICATE_PASSWORD \
                      MACOS_INSTALLER_IDENTITY APPLE_NOTARIZATION_KEY APPLE_NOTARIZATION_KEY_ID \
                      APPLE_NOTARIZATION_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::MACOS_SIGNING_ENABLED is true but the secret $name is missing."
              missing=1
            fi
          done
          exit "$missing"

      - name: Import the Developer ID certificates into a temporary keychain
        if: env.SIGN == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/application.p12"
          printf '%s' "$MACOS_INSTALLER_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/application.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain" \
            -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/application.p12" "$RUNNER_TEMP/installer.p12"
          security list-keychains -d user -s "$keychain" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null

      - name: Sign the binary (hardened runtime, secure timestamp)
        if: env.SIGN == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --options runtime \
            --identifier com.hodeitek.hodeishield \
            --keychain "$RUNNER_TEMP/signing.keychain-db" \
            --sign "$MACOS_SIGNING_IDENTITY" "stage/${BIN_NAME}"
          codesign --verify --strict --verbose=2 "stage/${BIN_NAME}"
          codesign --display --verbose=2 "stage/${BIN_NAME}"

      - name: Build and sign the installer package
        if: env.SIGN == 'true'
        env:
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pkgroot"
          mkdir -p "$root/usr/local/bin"
          cp -p "stage/${BIN_NAME}" "$root/usr/local/bin/"
          pkgbuild --root "$root" --install-location / \
            --identifier com.hodeitek.hodeishield --version "$VERSION" \
            "$RUNNER_TEMP/unsigned.pkg"
          mkdir -p dist
          productsign --timestamp --keychain "$RUNNER_TEMP/signing.keychain-db" \
            --sign "$MACOS_INSTALLER_IDENTITY" \
            "$RUNNER_TEMP/unsigned.pkg" "dist/hodeishield-${VERSION}-${TARGET}.pkg"
          pkgutil --check-signature "dist/hodeishield-${VERSION}-${TARGET}.pkg"

      - name: Remove the temporary keychain
        if: always() && env.SIGN == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/application.p12" "$RUNNER_TEMP/installer.p12"

      # notarytool takes a zip, a pkg or a dmg, not a bare executable or a tar.gz: the binary goes
      # in a zip used only for the submission. Its ticket is then known to Gatekeeper online.
      - name: Notarize the binary and the package, staple the package
        if: env.SIGN == 'true'
        env:
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$APPLE_NOTARIZATION_KEY" | base64 --decode > "$key"
          notarize() {
            xcrun notarytool submit "$1" --key "$key" --key-id "$APPLE_NOTARIZATION_KEY_ID" \
              --issuer "$APPLE_NOTARIZATION_ISSUER_ID" --wait --timeout 30m
          }
          ditto -c -k "stage/${BIN_NAME}" "$RUNNER_TEMP/notarize.zip"
          notarize "$RUNNER_TEMP/notarize.zip"
          pkg="dist/hodeishield-${VERSION}-${TARGET}.pkg"
          notarize "$pkg"
          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"
          spctl --assess --type install --verbose=2 "$pkg"

      - name: Package archive
        run: |
          set -euo pipefail
          mkdir -p dist
          dir="$RUNNER_TEMP/hodeishield-${VERSION}-${TARGET}"
          mkdir -p "$dir"
          cp -Rp stage/* "$dir/"
          tar -C "$RUNNER_TEMP" -czf "dist/hodeishield-${VERSION}-${TARGET}.tar.gz" "$(basename "$dir")"
          ls -l dist

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-universal-apple-darwin
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: build (x86_64-pc-windows-msvc)
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p hodeishield-cli

      - name: Stage the unsigned executable for the signing job
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage | Out-Null
          Copy-Item -Path "target/x86_64-pc-windows-msvc/release/$env:BIN_NAME.exe", "LICENSE", "NOTICE", "README.md" -Destination stage

      - name: Upload the unsigned executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-x86_64-pc-windows-msvc
          path: stage/*
          if-no-files-found: error
          retention-days: 1

  # Signs hodeishield.exe with Authenticode through Azure Artifact Signing, then packages it.
  # There is no certificate, password or .pfx anywhere: the key stays in Microsoft's HSM.
  # azure/login trades this job's GitHub OIDC token for an Azure session, through a federated
  # credential that trusts only this repository's `release-signing` environment, and the signing
  # action uses that session. Split from the build for the same reason as `sign-macos`: the job
  # that can mint the token checks nothing out and runs no repository or dependency code.
  #
  # Environment secrets (release-signing): AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
  # (directory identifiers, kept out of public logs). Environment variables: AZURE_SIGNING_ENDPOINT,
  # AZURE_SIGNING_ACCOUNT_NAME, AZURE_CERTIFICATE_PROFILE_NAME.
  sign-windows:
    name: sign and package (x86_64-pc-windows-msvc)
    needs: [version, build-windows]
    runs-on: windows-latest
    timeout-minutes: 30
    environment: ${{ needs.version.outputs.sign_windows == 'true' && 'release-signing' || '' }}
    permissions:
      contents: read
      id-token: write # OIDC federation to Azure; used only when this run signs
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SIGN: ${{ needs.version.outputs.sign_windows }}
    # The digest of the exe this job hands to the MSI build. A job output cannot be rewritten by
    # another job, so `windows-msi` checks what it downloads against this, not against a name.
    outputs:
      exe_sha256: ${{ steps.handoff.outputs.exe_sha256 }}
    steps:
      - name: Download the unsigned executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-x86_64-pc-windows-msvc
          path: stage

      # Anything else in the hand-off would be packaged, and possibly signed, as ours.
      - name: Refuse anything but the expected files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path stage).Path
          $found = @(Get-ChildItem -LiteralPath stage -Recurse -Force | ForEach-Object {
            $_.FullName.Substring($root.Length).TrimStart('\', '/')
          } | Sort-Object)
          $expected = @("hodeishield.exe", "LICENSE", "NOTICE", "README.md") | Sort-Object
          if (Compare-Object $found $expected) {
            Write-Host "::error::Unexpected hand-off contents: $($found -join ', ')"
            exit 1
          }

      - name: Check the signing inputs are present
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
        run: |
          $missing = @()
          foreach ($name in @("AZURE_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID",
                              "AZURE_SIGNING_ACCOUNT_NAME", "AZURE_CERTIFICATE_PROFILE_NAME")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { $missing += $name }
          }
          if ($env:AZURE_SIGNING_ENDPOINT -notmatch '^https://[a-z0-9]+\.codesigning\.azure\.net/?$') {
            $missing += "AZURE_SIGNING_ENDPOINT (https://<region>.codesigning.azure.net)"
          }
          foreach ($item in $missing) {
            Write-Host "::error::WINDOWS_SIGNING_ENABLED is true but $item is missing or malformed."
          }
          if ($missing.Count -gt 0) { exit 1 }

      - name: Azure login (OIDC)
        if: env.SIGN == 'true'
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The file is named, never a folder or a pattern: only what this job expects gets signed.
      - name: Sign hodeishield.exe (Azure Artifact Signing)
        if: env.SIGN == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\stage\hodeishield.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Drop the session before any other action runs. `always()` so it also runs after a failure.
      - name: Azure logout
        if: always() && env.SIGN == 'true'
        shell: pwsh
        run: |
          az logout 2>$null
          exit 0

      - name: Verify the Authenticode signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signature = Get-AuthenticodeSignature -LiteralPath stage\hodeishield.exe
          $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($signature.Status -ne "Valid" -or -not $signature.TimeStamperCertificate) {
            Write-Host "::error::hodeishield.exe is not validly signed and timestamped."
            exit 1
          }

      - name: Record the digest of the executable handed off
        id: handoff
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath stage\hodeishield.exe -Algorithm SHA256).Hash.ToLower()
          "exe_sha256=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "hodeishield.exe $hash"

      - name: Upload the signed executable for the MSI build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msi-input
          path: stage/*
          if-no-files-found: error
          retention-days: 1

      - name: Package archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stageName = "hodeishield-$env:VERSION-x86_64-pc-windows-msvc"
          $dir = Join-Path $env:RUNNER_TEMP $stageName
          New-Item -ItemType Directory -Path $dir, dist | Out-Null
          Copy-Item stage/* $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/$stageName.zip"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-x86_64-pc-windows-msvc
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # The Windows Installer package, built with WiX from the exe `sign-windows` signed. This job can
  # NOT sign: it has no id-token permission and no environment, because `dotnet tool install` and
  # the WiX build run third-party code. It installs the package silently, checks it, and removes it.
  windows-msi:
    name: msi (build and test)
    needs: [version, sign-windows]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      EXE_SHA256: ${{ needs.sign-windows.outputs.exe_sha256 }}
      # Pinned to 5.x: later WiX releases add maintenance-fee terms to their licence, to be reviewed
      # before moving. Bumped by hand in the periodic dependency review (CONTRIBUTING.md).
      WIX_VERSION: "5.0.2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the signed executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-msi-input
          path: msi-input

      - name: Check it is the executable sign-windows handed off
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hash = (Get-FileHash -LiteralPath msi-input\hodeishield.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:EXE_SHA256) {
            Write-Host "::error::hodeishield.exe is $hash, but sign-windows handed off $env:EXE_SHA256"
            exit 1
          }

      - name: Install WiX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build the MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Windows Installer versions are numeric: 0.3.0-rc.1 becomes 0.3.0.
          $msiVersion = ($env:VERSION -split '-')[0]
          New-Item -ItemType Directory -Path msi-out | Out-Null
          wix build -arch x64 -d "Version=$msiVersion" -d "SourceDir=$PWD\msi-input" `
            -o "msi-out\hodeishield-$env:VERSION-x86_64-pc-windows-msvc.msi" packaging\windows\hodeishield.wxs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem msi-out

      - name: Install, check and uninstall the MSI silently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = (Resolve-Path "msi-out\hodeishield-$env:VERSION-x86_64-pc-windows-msvc.msi").Path
          $dir = Join-Path $env:ProgramFiles "HodeiShield CLI"
          $envKey = "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 50; throw "install exited with $($p.ExitCode)" }
          $exe = Join-Path $dir "hodeishield.exe"
          if (-not (Test-Path $exe)) { throw "$exe is missing after install" }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() -ne $env:EXE_SHA256) { throw "installed exe differs" }
          $path = (Get-ItemProperty $envKey).Path
          if (($path -split ';') -notcontains "$dir\") { throw "PATH does not contain $dir\ : $path" }
          & $exe --version
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 50; throw "uninstall exited with $($p.ExitCode)" }
          if (Test-Path $exe) { throw "$exe is still there after uninstall" }
          $path = (Get-ItemProperty $envKey).Path
          if (($path -split ';') -contains "$dir\") { throw "PATH still contains $dir\ after uninstall" }
          Write-Host "Install, PATH entry and uninstall: OK"

      - name: Upload the unsigned MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msi-unsigned
          path: msi-out/*.msi
          if-no-files-found: error
          retention-days: 1

  # Signs the MSI with the same Azure Artifact Signing profile as the exe. Like `sign-windows`, it
  # checks nothing out and runs no repository or WiX code. The MSI is published only when signed.
  sign-msi:
    name: msi (sign)
    needs: [version, sign-windows, windows-msi]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: ${{ needs.version.outputs.sign_windows == 'true' && 'release-signing' || '' }}
    permissions:
      contents: read
      id-token: write # OIDC federation to Azure; used only when this run signs
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SIGN: ${{ needs.version.outputs.sign_windows }}
    steps:
      - name: Download the MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-msi-unsigned
          path: msi

      - name: Refuse anything but the expected file
        shell: pwsh
        run: |
          $found = @(Get-ChildItem -LiteralPath msi -Recurse -Force | ForEach-Object { $_.Name })
          $expected = "hodeishield-$env:VERSION-x86_64-pc-windows-msvc.msi"
          if ($found.Count -ne 1 -or $found[0] -ne $expected) {
            Write-Host "::error::Unexpected hand-off contents: $($found -join ', ')"
            exit 1
          }

      # The MSI was built by a job that ran WiX, third-party code: do not sign it on trust. Using
      # only Windows' own Installer API, check that it carries no custom actions or embedded
      # binaries (so nothing runs at install time but standard actions), then extract it with an
      # administrative install and check its payload is exactly the exe sign-windows signed, plus
      # LICENSE and NOTICE.
      - name: Check the MSI before signing it
        shell: powershell
        env:
          EXE_SHA256: ${{ needs.sign-windows.outputs.exe_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $msi = (Resolve-Path "msi\hodeishield-$env:VERSION-x86_64-pc-windows-msvc.msi").Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase($msi, 0)
          function Count-Rows([string]$table) {
            try { $view = $db.OpenView("SELECT * FROM ``$table``") } catch { return 0 }
            $view.Execute(); $n = 0
            while ($view.Fetch()) { $n++ }
            $view.Close(); return $n
          }
          $bad = @()
          foreach ($table in @("CustomAction", "Binary", "MsiEmbeddedUI", "MsiEmbeddedChainer")) {
            $n = Count-Rows $table
            Write-Host "$table rows: $n"
            if ($n -ne 0) { $bad += $table }
          }
          $files = Count-Rows "File"
          Write-Host "File rows: $files"
          if ($files -ne 3) { $bad += "File ($files rows, expected 3)" }
          [System.Runtime.InteropServices.Marshal]::ReleaseComObject($db) | Out-Null
          if ($bad.Count -gt 0) { Write-Host "::error::the MSI has unexpected content: $($bad -join ', ')"; exit 1 }

          $target = Join-Path $env:RUNNER_TEMP "msi-admin"
          $p = Start-Process msiexec.exe -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$target`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "administrative extraction exited with $($p.ExitCode)" }
          $payload = @(Get-ChildItem -LiteralPath $target -Recurse -File | Where-Object { $_.Extension -ne ".msi" })
          $names = @($payload | ForEach-Object { $_.Name } | Sort-Object)
          if (($names -join ",") -ne "hodeishield.exe,LICENSE,NOTICE") { Write-Host "::error::MSI payload: $($names -join ', ')"; exit 1 }
          $exe = $payload | Where-Object { $_.Name -eq "hodeishield.exe" }
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:EXE_SHA256) { Write-Host "::error::the exe in the MSI is $hash, not the signed $env:EXE_SHA256"; exit 1 }
          Remove-Item -Recurse -Force $target
          Write-Host "MSI content: OK (no custom actions or binaries; payload is the signed exe, LICENSE, NOTICE)"

      - name: Azure login (OIDC)
        if: env.SIGN == 'true'
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the MSI (Azure Artifact Signing)
        if: env.SIGN == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\msi\hodeishield-${{ needs.version.outputs.version }}-x86_64-pc-windows-msvc.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Azure logout
        if: always() && env.SIGN == 'true'
        shell: pwsh
        run: |
          az logout 2>$null
          exit 0

      - name: Verify the Authenticode signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signature = Get-AuthenticodeSignature -LiteralPath "msi\hodeishield-$env:VERSION-x86_64-pc-windows-msvc.msi"
          $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($signature.Status -ne "Valid" -or -not $signature.TimeStamperCertificate) {
            Write-Host "::error::the MSI is not validly signed and timestamped."
            exit 1
          }

      - name: Upload the signed MSI
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # `archive-` so `publish` picks it up with the archives.
          name: archive-msi
          path: msi/*.msi
          if-no-files-found: error
          retention-days: 7

  # .deb and .rpm packages for x86_64 and arm64, built with a pinned nfpm from the Linux archives,
  # so each package holds exactly the binary and man pages of the archive for its architecture,
  # plus shell completions. They are checksummed and signed with the archives in `publish`; the
  # archive's SBOM describes the binary they contain.
  packages:
    name: packages (deb, rpm)
    needs: [version, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NFPM_VERSION: "2.47.0"
      NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Linux archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*-unknown-linux-musl
          path: archives
          merge-multiple: true

      # Pinned and checked against the checksum above; bumped by hand in the periodic dependency
      # review (CONTRIBUTING.md).
      - name: Install nfpm
        run: |
          set -euo pipefail
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${archive}"
          echo "${NFPM_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" nfpm

      - name: Build the packages
        run: |
          set -euo pipefail
          mkdir -p dist
          config="$PWD/packaging/nfpm.yaml"
          # Completions come from the x86_64 binary, which runs here; they are the same for arm64.
          x86="$RUNNER_TEMP/x86_64-unknown-linux-musl"
          for pair in x86_64-unknown-linux-musl:amd64 aarch64-unknown-linux-musl:arm64; do
            target="${pair%%:*}"
            arch="${pair##*:}"
            work="$RUNNER_TEMP/$target"
            mkdir -p "$work"
            tar -xzf "archives/hodeishield-${VERSION}-${target}.tar.gz" -C "$work" --strip-components=1
            mkdir -p "$work/stage/man" "$work/stage/completions"
            cp "$work/hodeishield" "$work/LICENSE" "$work/NOTICE" "$work/stage/"
            for page in "$work"/man/*.1; do
              gzip -9n -c "$page" > "$work/stage/man/$(basename "$page").gz"
            done
            "$x86/hodeishield" completions bash > "$work/stage/completions/hodeishield.bash"
            "$x86/hodeishield" completions zsh > "$work/stage/completions/_hodeishield"
            "$x86/hodeishield" completions fish > "$work/stage/completions/hodeishield.fish"
            for packager in deb rpm; do
              (cd "$work/stage" && VERSION="$VERSION" ARCH="$arch" \
                "$RUNNER_TEMP/nfpm" package -f "$config" -p "$packager" -t "$GITHUB_WORKSPACE/dist/")
            done
          done
          ls -l dist

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # `archive-` so `publish` picks them up with the archives.
          name: archive-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # A CycloneDX SBOM of the binary for each archive: the crates compiled into it for that target,
  # without build-time or development dependencies. Separate from `publish` so the tool, a
  # cargo-installed third-party crate, never runs in a job that can sign or write to the release.
  # The two Linux architectures have the same dependency set, as do the two halves of the macOS
  # universal binary; each archive still gets its own SBOM, named after it.
  sbom:
    name: sbom
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show

      # Pinned; bumped by hand in the periodic dependency review (CONTRIBUTING.md).
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate one SBOM per archive
        run: |
          set -euo pipefail
          mkdir -p dist
          # archive name suffix -> Rust target the dependency set is resolved for
          for pair in \
            x86_64-unknown-linux-musl:x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl:aarch64-unknown-linux-musl \
            universal-apple-darwin:aarch64-apple-darwin \
            x86_64-pc-windows-msvc:x86_64-pc-windows-msvc; do
            name="${pair%%:*}"
            target="${pair##*:}"
            cargo cyclonedx --manifest-path crates/hodeishield-cli/Cargo.toml --format json \
              --spec-version 1.5 --describe binaries --no-build-deps --target "$target" \
              --target-in-filename
            mv "crates/hodeishield-cli/hodeishield_bin_${target}.cdx.json" \
              "dist/hodeishield-${VERSION}-${name}.cdx.json"
          done
          for f in dist/*.cdx.json; do
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(sys.argv[1], len(d['components']), 'components')" "$f"
          done

      - name: Upload the SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # `archive-` so `publish` picks them up with the archives.
          name: archive-sbom
          path: dist/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  # Downloads every archive, hashes and keylessly signs them with cosign, and
  # opens a DRAFT GitHub release with everything attached. The owner reviews
  # and publishes the draft by hand; this job never publishes a non-draft
  # release.
  publish:
    name: publish (draft release)
    needs: [version, build-linux, sign-macos, sign-windows, sign-msi, sbom, packages]
    # Only a pushed tag publishes; a manual run is always a dry run, whatever the ref is called.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the draft release and upload assets
      id-token: write # for cosign's Sigstore keyless (OIDC) signing
    outputs:
      subjects-b64: ${{ steps.subjects.outputs.subjects-b64 }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Each artifact lands in its own directory (no merging, so one cannot overwrite another), and
      # only the exact set of artifacts and file names this release produces is taken. Several jobs
      # run third-party code (build scripts, cargo-cyclonedx, nfpm, WiX); an extra `archive-*`
      # artifact from any of them makes this step fail instead of being published and signed.
      - name: Download the release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          path: artifacts
          merge-multiple: false

      - name: Take exactly the expected files
        env:
          V: ${{ needs.version.outputs.version }}
          SIGN_MACOS: ${{ needs.version.outputs.sign_macos }}
          SIGN_WINDOWS: ${{ needs.version.outputs.sign_windows }}
        run: |
          set -euo pipefail
          pv="${V//-/\~}" # how deb and rpm write a pre-release version
          {
            echo "archive-x86_64-unknown-linux-musl hodeishield-$V-x86_64-unknown-linux-musl.tar.gz"
            echo "archive-aarch64-unknown-linux-musl hodeishield-$V-aarch64-unknown-linux-musl.tar.gz"
            echo "archive-universal-apple-darwin hodeishield-$V-universal-apple-darwin.tar.gz"
            [ "$SIGN_MACOS" = true ] && echo "archive-universal-apple-darwin hodeishield-$V-universal-apple-darwin.pkg"
            echo "archive-x86_64-pc-windows-msvc hodeishield-$V-x86_64-pc-windows-msvc.zip"
            [ "$SIGN_WINDOWS" = true ] && echo "archive-msi hodeishield-$V-x86_64-pc-windows-msvc.msi"
            for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl universal-apple-darwin x86_64-pc-windows-msvc; do
              echo "archive-sbom hodeishield-$V-$t.cdx.json"
            done
            echo "archive-packages hodeishield_${pv}-1_amd64.deb"
            echo "archive-packages hodeishield_${pv}-1_arm64.deb"
            echo "archive-packages hodeishield-${pv}-1.x86_64.rpm"
            echo "archive-packages hodeishield-${pv}-1.aarch64.rpm"
          } | LC_ALL=C sort > "$RUNNER_TEMP/expected"
          (cd artifacts && find . -mindepth 1 | sed 's|^\./||' | while read -r entry; do
            case "$entry" in
              */*) [ -f "$entry" ] && [ ! -L "$entry" ] && echo "${entry%%/*} ${entry#*/}" || echo "NOT-A-FILE $entry" ;;
              *) [ -d "$entry" ] || echo "NOT-A-DIRECTORY $entry" ;;
            esac
          done) | LC_ALL=C sort > "$RUNNER_TEMP/found"
          if ! diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/found"; then
            echo "::error::The release artifacts are not exactly the expected set (diff above)."
            exit 1
          fi
          mkdir dist
          while read -r artifact file; do
            cp "artifacts/$artifact/$file" dist/
          done < "$RUNNER_TEMP/expected"
          ls -l dist

      # The installer is published with the release, so it is checksummed and signed like the
      # archives: a user can verify it before running it.
      - name: Add the install script
        run: cp install.sh dist/install.sh

      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Base64-encode SHA256SUMS for the provenance generator
        id: subjects
        working-directory: dist
        run: echo "subjects-b64=$(base64 -w0 < SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Keyless signing: cosign requests a short-lived certificate from
      # Fulcio using this job's GitHub OIDC token (id-token: write above) and
      # records the signature in the public Rekor transparency log. No
      # signing key or secret is used or stored anywhere.
      - name: Sign every archive and SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          for f in hodeishield-*.tar.gz hodeishield-*.zip hodeishield-*.msi hodeishield-*.pkg hodeishield[-_]*.deb hodeishield-*.rpm hodeishield-*.cdx.json install.sh SHA256SUMS; do
            [ -e "$f" ] || continue
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      # The notes are the version's CHANGELOG section, then how to verify the download, then
      # GitHub's list of merged pull requests (--generate-notes appends it after the notes file).
      - name: Write the release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          {
            sh .github/scripts/changelog-section.sh "${TAG#v}"
            echo
            echo "Verify the download as described in [Verifying releases](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/verifying-releases.md)."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            dist/*

  # SLSA build provenance for the release archives. The generic generator's
  # `draft-release` input lets it append the signed provenance to the draft
  # release created above instead of requiring a published release.
  provenance:
    name: provenance
    needs: publish
    permissions:
      id-token: write # for the generator's own keyless signing
      contents: write # to attach the provenance file to the draft release
      actions: read
    # Pinned by tag, not SHA: the slsa-framework/slsa-github-generator docs
    # require reusable workflow callers to reference it by tag so its
    # internal integrity checks (which compare the calling ref) still work.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.publish.outputs.subjects-b64 }}
      upload-assets: true
