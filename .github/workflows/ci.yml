name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the channel/components; `rustup show` reads
      # it and installs a matching toolchain if one isn't already present, so
      # no third-party toolchain-install action is needed.
      - name: Install pinned toolchain
        run: rustup show

      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  codegen:
    name: codegen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify the generated API client is up to date
        run: cargo xtask codegen --check

      - name: Generate man pages
        run: cargo xtask man target/man

      - name: Verify man pages exist
        run: |
          test -s target/man/hodeishield.1
          test -s target/man/hodeishield-vendors-list.1

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-${{ matrix.os }}

      # Linux keyring backend is zbus-secret-service-keyring-store, a
      # pure-Rust D-Bus client (no libdbus / keychain required), so the test
      # suite does not need a D-Bus session or an OS keychain in CI.
      - name: cargo test
        run: cargo test --workspace --locked

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Pinned to the version validated locally against deny.toml. Bumped by hand in the periodic
      # dependency review (CONTRIBUTING.md).
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: cargo deny check
        run: cargo deny check

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Pinned to the version validated locally. Bumped by hand in the periodic dependency review
      # (CONTRIBUTING.md).
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: cargo audit
        run: cargo audit

  # The install script: lint it, then install the latest published release with it, signature
  # check included.
  install-script:
    name: install-script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck -s sh install.sh packaging/repo/*.sh

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Install the latest release with the script
        run: |
          set -eu
          sh install.sh --dir "$RUNNER_TEMP/bin"
          test -x "$RUNNER_TEMP/bin/hodeishield"
          test -s "$RUNNER_TEMP/share/man/man1/hodeishield.1" || echo "no man pages in that release"
          if PATH=/usr/bin:/bin sh install.sh --dir "$RUNNER_TEMP/none" 2> "$RUNNER_TEMP/err"; then
            echo "::error::install.sh ran without cosign and without --no-verify"
            exit 1
          fi
          grep -q -- "--no-verify" "$RUNNER_TEMP/err"

  # The repository freshness monitor must go red: its control builds small repositories with a
  # throwaway key, serves them from localhost and checks that every stale, altered, unsigned or
  # missing case fails and the current one passes.
  repo-freshness:
    name: repo-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the control cases
        run: sh packaging/repo/freshness-test.sh

  # A pull request into main is a release: the version in Cargo.toml must have its notes.
  changelog:
    name: changelog
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the changelog has an entry for the version being released
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "Version: $version"
          sh .github/scripts/changelog-section.sh "$version"

  commit-messages:
    name: commit-messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same check as the local commit-msg hook (.githooks/check-message.sh).
      # Untrusted values go through env, never straight into the script.
      - name: Check commit messages and PR description
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # Commits up to and including this one predate the rule and are not checked.
          MESSAGE_RULE_SINCE: f14c8b418bd37fb3c51e689edba0e668162fd90c
        run: |
          status=0
          for commit in $(git rev-list "$HEAD_SHA" ^"$BASE_SHA" ^"$MESSAGE_RULE_SINCE"); do
            if ! git log -1 --format=%B "$commit" | sh .githooks/check-message.sh 2>/dev/null; then
              echo "::error::Commit $commit mentions Claude (see CONTRIBUTING.md)"
              status=1
            fi
          done
          if ! printf '%s\n' "$PR_BODY" | sh .githooks/check-message.sh 2>/dev/null; then
            echo "::error::The PR description mentions Claude (see CONTRIBUTING.md)"
            status=1
          fi
          exit "$status"

      # Developer Certificate of Origin: every commit needs a matching
      # Signed-off-by trailer (.githooks/check-signoff.sh). Independent of the
      # step above: both run, and the job fails if either fails.
      - name: Check DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Commits up to and including this one predate the DCO requirement and are not checked.
          DCO_SINCE: b6b722db7c85ecc89b95280d393c81b45136658c
        run: sh .githooks/check-signoff.sh "$HEAD_SHA" ^"$BASE_SHA" ^"$DCO_SINCE"
