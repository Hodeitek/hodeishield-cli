name: Proxy and TLS inspection

# Checks the README's "Networking: proxies and TLS inspection" claims on Linux, macOS and Windows
# against a real TLS-inspecting proxy (mitmproxy) and a fake API, both on the runner, with
# throwaway certificates:
# nothing secret is used and nothing leaves the machine except the download of mitmproxy. Case 1
# is a deliberate certificate failure, so the script is only meant to run here (see
# .github/scripts/proxy-tls-test.sh).
on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "crates/hodeishield-api/**"
      - "crates/hodeishield-cli/**"
      - ".github/scripts/proxy-tls-*"
      - ".github/workflows/proxy-tls.yml"
  push:
    branches: [dev, main]
    paths:
      - "Cargo.lock"
      - "crates/hodeishield-api/**"
      - "crates/hodeishield-cli/**"
      - ".github/scripts/proxy-tls-*"
      - ".github/workflows/proxy-tls.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: proxy-tls-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  proxy-tls:
    name: proxy-tls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Official mitmproxy releases, pinned by version and checksum. Bumped by hand.
        # The download site publishes no checksum file, so each SHA-256 is the one of the
        # release archive as downloaded when it was pinned (trust on first use). mitmproxy
        # is only a test tool here and is never shipped. When bumping, record the new
        # archives' SHA-256 the same way.
        include:
          - os: ubuntu-latest
            mitm_archive: mitmproxy-12.2.3-linux-x86_64.tar.gz
            mitm_sha256: 2e95286b618fa6fd33e5e62a78c2e5112571d85f42ec2bac29b97ee242bdb5c5
            mitm_dir: mitmproxy
            bin: target/debug/hodeishield
          - os: macos-latest
            mitm_archive: mitmproxy-12.2.3-macos-arm64.tar.gz
            mitm_sha256: 0a09ee3b82569e8985aff8186e4792618b8e5d0c766098db093d09a87d4b013a
            mitm_dir: mitmproxy/mitmproxy.app/Contents/MacOS
            bin: target/debug/hodeishield
          - os: windows-latest
            mitm_archive: mitmproxy-12.2.3-windows-x86_64.zip
            mitm_sha256: 04a01ea95ae96df75058a893e774957d294e69012dab1f4e256ce2b0c6725483
            mitm_dir: mitmproxy
            bin: target/debug/hodeishield.exe
    defaults:
      run:
        shell: bash
    env:
      MITMPROXY_VERSION: "12.2.3"
      MITM_ARCHIVE: ${{ matrix.mitm_archive }}
      MITM_SHA256: ${{ matrix.mitm_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: proxy-tls

      - name: Build the CLI
        run: cargo build --locked -p hodeishield-cli

      - name: Install mitmproxy
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$MITM_ARCHIVE" \
            "https://downloads.mitmproxy.org/${MITMPROXY_VERSION}/${MITM_ARCHIVE}"
          if command -v sha256sum > /dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          echo "${MITM_SHA256}  $RUNNER_TEMP/$MITM_ARCHIVE" | $sum -c -
          mkdir "$RUNNER_TEMP/mitmproxy"
          case "$MITM_ARCHIVE" in
            *.zip) 7z x -y "-o$RUNNER_TEMP/mitmproxy" "$RUNNER_TEMP/$MITM_ARCHIVE" > /dev/null ;;
            *) tar -xzf "$RUNNER_TEMP/$MITM_ARCHIVE" -C "$RUNNER_TEMP/mitmproxy" ;;
          esac

      # macOS ships LibreSSL as `openssl`; the script needs OpenSSL 3 (req -addext).
      - name: Use Homebrew OpenSSL on macOS
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Run the proxy cases
        env:
          BIN: ${{ matrix.bin }}
          MITM_DIR: ${{ matrix.mitm_dir }}
        run: bash .github/scripts/proxy-tls-test.sh "$BIN" "${RUNNER_TEMP//\\//}/$MITM_DIR"
