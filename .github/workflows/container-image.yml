name: Container image

# When a release is published (not while it is a draft), builds ghcr.io/hodeitek/hodeishield-cli for
# linux/amd64 and linux/arm64 from that release's own musl binaries, signs the image by digest with
# cosign (keyless) and attaches the release's CycloneDX SBOM as a signed attestation. Nothing is
# compiled here: the binaries come from the release archives, which are checked against the
# release workflow's signed SHA256SUMS first. No `latest` tag is ever written.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: container-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hodeitek/hodeishield-cli

jobs:
  image:
    name: build, push and sign the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Publishing to a registry is approved by the same reviewer as the other package channels.
    environment: packaging
    permissions:
      contents: read
      packages: write # to push the image with the job's own token; no other job has it
      id-token: write # for cosign's Sigstore keyless (OIDC) signing
    steps:
      - name: Read the release version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$PRERELEASE" = true ]; then
            echo "::notice::$TAG is not a stable release; no container image is published."
            exit 0
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.version.outputs.version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        if: steps.version.outputs.version != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Only the two Linux archives, their SBOMs and the file that vouches for them are downloaded.
      - name: Download and verify the release files
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          files=()
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            files+=("hodeishield-${VERSION}-${t}.tar.gz" "hodeishield-${VERSION}-${t}.cdx.json")
          done
          mkdir rel
          args=(-p SHA256SUMS -p SHA256SUMS.sigstore.json)
          for f in "${files[@]}"; do args+=(-p "$f"); done
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D rel "${args[@]}"
          cosign verify-blob --bundle rel/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v${VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-trigger push rel/SHA256SUMS
          for f in "${files[@]}"; do grep "  ${f}\$" rel/SHA256SUMS; done > rel/files.sums
          [ "$(wc -l < rel/files.sums)" = 4 ]
          (cd rel && sha256sum -c files.sums)

      # amd64/ and arm64/ are the names the Dockerfile's TARGETARCH picks from.
      - name: Stage the build context
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ctx/amd64 ctx/arm64 ext
          for pair in x86_64-unknown-linux-musl:amd64 aarch64-unknown-linux-musl:arm64; do
            t="${pair%%:*}" arch="${pair##*:}"
            tar -xzf "rel/hodeishield-${VERSION}-${t}.tar.gz" -C ext
            d="ext/hodeishield-${VERSION}-${t}"
            [ -f "$d/hodeishield" ] && [ ! -L "$d/hodeishield" ]
            cp "$d/hodeishield" "ctx/$arch/hodeishield"
            cp "$d/LICENSE" "$d/NOTICE" ctx/
          done
          # Both Linux targets are built from the same dependency set, so one SBOM describes the
          # image; this checks that claim instead of assuming it.
          python3 - "rel/hodeishield-${VERSION}-x86_64-unknown-linux-musl.cdx.json" "rel/hodeishield-${VERSION}-aarch64-unknown-linux-musl.cdx.json" <<'PY'
          import json, sys
          a, b = (sorted(c["purl"] for c in json.load(open(p))["components"]) for p in sys.argv[1:])
          if a != b:
              sys.exit("the two Linux SBOMs list different components")
          print(len(a), "components, identical for both architectures")
          PY
          find ctx -type f | sort

      - name: Set up Buildx
        if: steps.version.outputs.version != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: steps.version.outputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Only COPY steps, so building the arm64 image needs no emulation.
      - name: Build and push
        if: steps.version.outputs.version != ''
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build ctx \
            --file packaging/container/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE}:${VERSION}" \
            --label "org.opencontainers.image.title=hodeishield" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --provenance=false --sbom=false \
            --metadata-file "$RUNNER_TEMP/build.json" \
            --push
          digest=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['containerimage.digest'])" "$RUNNER_TEMP/build.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}:${VERSION} as ${digest}"

      # Keyless, and by digest: the tag can move, the digest cannot.
      - name: Sign the image
        if: steps.version.outputs.version != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attach the SBOM as an attestation
        if: steps.version.outputs.version != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate "rel/hodeishield-${VERSION}-x86_64-unknown-linux-musl.cdx.json" \
            "${IMAGE}@${DIGEST}"

      # Checks what a user will check, with the constraints the README gives, then runs the image.
      - name: Verify the signature and the attestation, and run the image
        if: steps.version.outputs.version != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container-image.yml@refs/tags/v${VERSION}"
          verify=(--certificate-identity "$identity"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
            --certificate-github-workflow-trigger release)
          cosign verify "${verify[@]}" "${IMAGE}@${DIGEST}" > /dev/null
          cosign verify-attestation --type cyclonedx "${verify[@]}" "${IMAGE}@${DIGEST}" > /dev/null
          [ "$(docker run --rm "${IMAGE}@${DIGEST}" --version)" = "hodeishield ${VERSION}" ]
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
