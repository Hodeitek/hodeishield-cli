name: Re-sign package repository

# Recovery after the signing subkey of the APT and DNF repositories has been revoked and replaced
# (CONTRIBUTING.md, "The repository signing key"): signs the RPM packages already in the bucket again
# with the new subkey and regenerates the indexes, with packaging/repo/resign.sh. Started by hand only,
# from main only. It runs in the packaging-resign environment (main only; one maintainer approves),
# whose secrets are set only during a recovery.
#
# Nothing typed when starting the run chooses a release: the releases are those whose packages are in
# the bucket, and each must be a published stable release of this repository whose SHA256SUMS cosign
# verifies against the release workflow's identity. Every package in the bucket must then be one of
# those verified release assets (a .deb byte for byte, an RPM apart from its signature), checked before
# anything is signed. The inputs only choose between a dry run (the default: the bucket is read and
# everything is checked, nothing is uploaded) and an apply, which also needs the primary key
# fingerprint that the README publishes; publish.sh refuses an apply unless the bucket's versioning
# reads Enabled, so the replaced RPM objects are kept.
#
# A first job, with no environment, checks that packaging-resign exists and is protected (a required
# reviewer, no administrator bypass, deployments from main only) before the job that uses it starts.
#
# It shares the concurrency group of the other packaging workflows, so a pending run here and a pending
# release can displace each other: start it when no release is pending.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Upload the result. Leave off for a dry run."
        required: true
        default: false
        type: boolean
      confirm:
        description: "With apply: the primary key fingerprint published in the README (spaces allowed)"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: package-managers
  cancel-in-progress: false

jobs:
  # Before the job that names packaging-resign starts: a job that names an environment that does not
  # exist creates it, unprotected. This job has no environment and only reads the environment's
  # settings (public for a public repository; GITHUB_TOKEN needs actions: read), and fails unless it
  # exists with a required reviewer, no administrator bypass, and deployments from main only.
  preflight:
    name: check the packaging-resign environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to read the environment and its deployment branch policies
    steps:
      - name: Check the environment's protection rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          env_url="repos/$GITHUB_REPOSITORY/environments/packaging-resign"
          if ! settings=$(gh api "$env_url" 2> /dev/null); then
            echo "::error::The packaging-resign environment does not exist or cannot be read. Create it as CONTRIBUTING.md describes (\"The packaging-resign environment\") before running this workflow."
            exit 1
          fi
          policies=$(gh api --paginate "$env_url/deployment-branch-policies" --jq '.branch_policies[] | "\(.type) \(.name)"')
          problems=$(jq -r --arg policies "$policies" '
            [ (if ([.protection_rules[]? | select(.type == "required_reviewers") | (.reviewers // []) | length] | add // 0) < 1
               then "no required reviewer" else empty end),
              (if any(.protection_rules[]?; .type == "branch_policy") then empty else "no deployment branch policy" end),
              (if .deployment_branch_policy.custom_branch_policies == true and .deployment_branch_policy.protected_branches == false
               then empty else "the deployment branches are not custom branch policies" end),
              (if .can_admins_bypass == false then empty else "administrators can bypass the protection rules" end),
              (if $policies == "branch main" then empty else "the deployment branch policies are not exactly the branch main (they are: \($policies | gsub("\n"; ", ")))" end)
            ] | join("; ")' <<< "$settings")
          if [ -n "$problems" ]; then
            echo "::error::The packaging-resign environment is not protected as CONTRIBUTING.md requires: $problems. Nothing was run."
            exit 1
          fi
          echo "packaging-resign: a required reviewer, no administrator bypass, deployments from main only."

  resign:
    name: re-sign the RPM packages and rebuild the indexes
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A separate environment from the release's `packaging`: it accepts deployments from main only,
    # and its secrets stay empty outside a recovery (see CONTRIBUTING.md).
    environment: packaging-resign
    permissions:
      contents: read
    steps:
      - name: Check the inputs and the setup
        env:
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
          ENDPOINT: ${{ vars.PACKAGES_S3_ENDPOINT }}
          REGION: ${{ vars.PACKAGES_S3_REGION }}
          BUCKET: ${{ vars.PACKAGES_S3_BUCKET }}
          ACCESS_KEY_ID: ${{ secrets.PACKAGES_S3_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.PACKAGES_S3_SECRET_ACCESS_KEY }}
          SIGNING_KEY: ${{ secrets.PACKAGES_GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # Not the security boundary: a branch can change this file. What keeps a run from another
          # branch away from the secrets is the packaging-resign environment's deployment-branch rule
          # (CONTRIBUTING.md); this check only fails early and clearly.
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::This workflow must be started from main, not $REF."
            exit 1
          fi
          missing=""
          [ -n "$ENDPOINT" ] || missing="$missing PACKAGES_S3_ENDPOINT"
          [ -n "$REGION" ] || missing="$missing PACKAGES_S3_REGION"
          [ -n "$BUCKET" ] || missing="$missing PACKAGES_S3_BUCKET"
          [ -n "$ACCESS_KEY_ID" ] || missing="$missing PACKAGES_S3_ACCESS_KEY_ID"
          [ -n "$SECRET_ACCESS_KEY" ] || missing="$missing PACKAGES_S3_SECRET_ACCESS_KEY"
          [ -n "$SIGNING_KEY" ] || missing="$missing PACKAGES_GPG_SIGNING_KEY"
          if [ -n "$missing" ]; then
            echo "::error::The packaging-resign environment lacks:$missing (its secrets are set only for a recovery, see CONTRIBUTING.md)"
            exit 1
          fi
          if [ "$APPLY" = true ] && [ -z "$CONFIRM" ]; then
            echo "::error::apply needs the primary key fingerprint in confirm."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exactly one key, the pinned one, also stated in the README, before anything is read or signed.
      - name: Check the public key is committed
        run: |
          if [ ! -s packaging/gpg.key ]; then
            echo "::error::packaging/gpg.key is missing."
            exit 1
          fi
          sh packaging/repo/keycheck.sh packaging/gpg.key README.md

      # The releases to re-sign are read from the names of the packages in the bucket, by
      # packaging/repo/bucket-releases.sh (tested in repo-test.sh). The bucket is not trusted for anything
      # else: a name only selects a release, which must be a published stable release and is verified
      # below, and resign.sh then requires the bucket's packages to be exactly those verified assets.
      # A package name of any other form stops the run, and so does a stable release newer than
      # LAST_RELEASE_WITHOUT_REPOSITORY (packaging/repo/live.sh) that is not in the bucket.
      - name: List the releases in the bucket
        id: releases
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PACKAGES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PACKAGES_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.PACKAGES_S3_REGION }}
          ENDPOINT: ${{ vars.PACKAGES_S3_ENDPOINT }}
          BUCKET: ${{ vars.PACKAGES_S3_BUCKET }}
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          listings="$RUNNER_TEMP/listings"
          mkdir "$listings"
          aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket "$BUCKET" --prefix apt/pool/ \
            --output json > "$listings/apt.json"
          aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" --bucket "$BUCKET" --prefix rpm/ \
            --output json > "$listings/rpm.json"
          gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName --jq '.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("v")' \
            > "$listings/stable"
          versions=$(sh packaging/repo/bucket-releases.sh "$listings/stable" "$listings/apt.json" "$listings/rpm.json" |
            tr '\n' ' ')
          versions=${versions% }
          [[ "$versions" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\ [0-9]+\.[0-9]+\.[0-9]+)*$ ]] || {
            echo "::error::Unexpected list of releases: $versions"
            exit 1
          }
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          {
            if [ "$APPLY" = true ]; then
              echo "## Re-sign package repository: APPLY (the bucket will be changed)"
            else
              echo "## Re-sign package repository: dry run (nothing is uploaded)"
            fi
            echo
            echo "Releases whose packages are in the bucket and are re-signed:"
            echo
            for v in $versions; do echo "- \`$v\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Every release's packages, each verified against that release's SHA256SUMS, which cosign
      # verifies against the release workflow's identity (as docs/verifying-releases.md documents: the
      # release workflow, run by the push of that tag). These release assets are the only source the
      # RPM packages are signed from, and what every package in the bucket is compared with before
      # anything is signed; nothing in the bucket is trusted. The .rpm and .deb assets are kept apart
      # and handed to resign.sh read-only.
      - name: Download and verify the packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ steps.releases.outputs.versions }}
        run: |
          set -euo pipefail
          mkdir release-rpms release-debs
          for VERSION in $VERSIONS; do
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION' is not a stable version."; exit 1; }
            # A published, final release only: a draft or a prerelease is never published to the bucket.
            state=$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json isPrerelease,isDraft \
              --jq '"\(.isPrerelease) \(.isDraft)"')
            if [ "$state" != "false false" ]; then
              echo "::error::Release v$VERSION is a prerelease or a draft (or cannot be read)."
              exit 1
            fi
            packages=(
              "hodeishield_${VERSION}-1_amd64.deb"
              "hodeishield_${VERSION}-1_arm64.deb"
              "hodeishield-${VERSION}-1.x86_64.rpm"
              "hodeishield-${VERSION}-1.aarch64.rpm"
            )
            rm -rf "rel-$VERSION"
            mkdir "rel-$VERSION"
            args=(-p SHA256SUMS -p SHA256SUMS.sigstore.json)
            for p in "${packages[@]}"; do args+=(-p "$p"); done
            gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D "rel-$VERSION" "${args[@]}"
            cosign verify-blob --bundle "rel-$VERSION/SHA256SUMS.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v${VERSION}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-trigger push "rel-$VERSION/SHA256SUMS"
            for p in "${packages[@]}"; do
              awk -v f="$p" '$2 == f' "rel-$VERSION/SHA256SUMS" > "rel-$VERSION/package.sums"
              if [ "$(wc -l < "rel-$VERSION/package.sums")" != 1 ]; then
                echo "::error::$p is not listed exactly once in the SHA256SUMS of v$VERSION."
                exit 1
              fi
              (cd "rel-$VERSION" && sha256sum -c --strict package.sums)
              case $p in *.rpm) out=release-rpms ;; *) out=release-debs ;; esac
              if [ -e "$out/$p" ]; then
                echo "::error::$p is there twice."
                exit 1
              fi
              cp "rel-$VERSION/$p" "$out/"
            done
          done
          ls -l release-rpms release-debs

      # The same image as the release's `repos` job, with exactly these packages.
      - name: Build the repository image
        run: |
          set -euo pipefail
          . packaging/repo/image
          docker build --quiet --tag hodeishield-repo - <<EOF
          FROM $IMAGE
          RUN apt-get update -qq && apt-get install -y -qq --no-install-recommends $PACKAGES \
            && rm -rf /var/lib/apt/lists/*
          EOF
          read -ra packages <<< "$PACKAGES"
          docker run --rm hodeishield-repo dpkg-query -W -f '${Package} ${Version}\n' "${packages[@]%%=*}"

      # A throwaway keyring holding only the new signing subkey, removed at the end of the job.
      - name: Import the signing subkey
        id: key
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          SIGNING_KEY: ${{ secrets.PACKAGES_GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --quiet --import
          gpg --batch --quiet --import packaging/gpg.key
          # Only a signing subkey that is usable and whose secret is present counts: not a stub without
          # its secret (field 15 is #), nor a revoked, expired or invalid one (field 2 is r, e or i).
          fingerprints=$(gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "ssb" { sign = ($12 ~ /s/ && $15 !~ /#/ && $2 !~ /[rei]/) } $1 == "fpr" && sign { print $10; sign = 0 }')
          if [ "$(printf '%s\n' "$fingerprints" | grep -c .)" != 1 ]; then
            echo "::error::PACKAGES_GPG_SIGNING_KEY must hold exactly one signing subkey."
            exit 1
          fi
          echo "signing_key=${fingerprints}!" >> "$GITHUB_OUTPUT"

      - name: Re-sign the RPM packages and rebuild the indexes
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          PACKAGES_S3_ENDPOINT: ${{ vars.PACKAGES_S3_ENDPOINT }}
          PACKAGES_S3_REGION: ${{ vars.PACKAGES_S3_REGION }}
          PACKAGES_S3_BUCKET: ${{ vars.PACKAGES_S3_BUCKET }}
          PACKAGES_S3_ACCESS_KEY_ID: ${{ secrets.PACKAGES_S3_ACCESS_KEY_ID }}
          PACKAGES_S3_SECRET_ACCESS_KEY: ${{ secrets.PACKAGES_S3_SECRET_ACCESS_KEY }}
          SIGNING_KEY: ${{ steps.key.outputs.signing_key }}
          APPLY: ${{ inputs.apply }}
          RESIGN_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          flag=()
          if [ "$APPLY" = true ]; then flag=(--apply); fi
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env PACKAGES_S3_ENDPOINT --env PACKAGES_S3_REGION --env PACKAGES_S3_BUCKET \
            --env PACKAGES_S3_ACCESS_KEY_ID --env PACKAGES_S3_SECRET_ACCESS_KEY \
            --env SIGNING_KEY --env RESIGN_CONFIRM --env GNUPGHOME=/gnupg --env PUBLIC_KEY=/gpg.key \
            --env README_FILE=/README.md \
            --volume "$GNUPGHOME:/gnupg" \
            --volume "$PWD/packaging/gpg.key:/gpg.key:ro" \
            --volume "$PWD/README.md:/README.md:ro" \
            --volume "$PWD/packaging/repo:/repo:ro" \
            --volume "$PWD/release-rpms:/release-rpms:ro" \
            --volume "$PWD/release-debs:/release-debs:ro" \
            hodeishield-repo sh /repo/resign.sh "${flag[@]}" /release-rpms /release-debs

      - name: Remove the keyring
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          gpgconf --homedir "$GNUPGHOME" --kill all || true
          rm -rf "$GNUPGHOME"
