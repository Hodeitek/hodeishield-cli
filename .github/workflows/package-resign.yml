name: Re-sign package repository

# Recovery after the signing subkey of the APT and DNF repositories has been revoked and replaced
# (CONTRIBUTING.md, "The repository signing key"): signs the RPM packages already in the bucket again
# with the new subkey and regenerates the indexes, with packaging/repo/resign.sh. Started by hand only.
# It runs in the packaging environment, so it needs the same approval as a release's repository
# publication. A dry run (the default) reads the bucket and checks everything but uploads nothing.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Versions of every release in the bucket, separated by spaces (for example 0.3.1 0.3.2)"
        required: true
        type: string
      apply:
        description: "Upload the result. Leave off for a dry run."
        required: true
        default: false
        type: boolean
      confirm:
        description: "With apply: the fingerprint of the primary key in packaging/gpg.key"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: package-managers
  cancel-in-progress: false

jobs:
  resign:
    name: re-sign the RPM packages and rebuild the indexes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: packaging
    permissions:
      contents: read
    steps:
      - name: Check the inputs and the setup
        id: config
        env:
          VERSIONS: ${{ inputs.versions }}
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          ENDPOINT: ${{ vars.PACKAGES_S3_ENDPOINT }}
          REGION: ${{ vars.PACKAGES_S3_REGION }}
          BUCKET: ${{ vars.PACKAGES_S3_BUCKET }}
          ACCESS_KEY_ID: ${{ secrets.PACKAGES_S3_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.PACKAGES_S3_SECRET_ACCESS_KEY }}
          SIGNING_KEY: ${{ secrets.PACKAGES_GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$ENDPOINT" ] || missing="$missing PACKAGES_S3_ENDPOINT"
          [ -n "$REGION" ] || missing="$missing PACKAGES_S3_REGION"
          [ -n "$BUCKET" ] || missing="$missing PACKAGES_S3_BUCKET"
          [ -n "$ACCESS_KEY_ID" ] || missing="$missing PACKAGES_S3_ACCESS_KEY_ID"
          [ -n "$SECRET_ACCESS_KEY" ] || missing="$missing PACKAGES_S3_SECRET_ACCESS_KEY"
          [ -n "$SIGNING_KEY" ] || missing="$missing PACKAGES_GPG_SIGNING_KEY"
          if [ -n "$missing" ]; then
            echo "::error::The packaging environment lacks:$missing"
            exit 1
          fi
          # Only version numbers reach the commands below.
          for v in $VERSIONS; do
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::'$v' is not a release version."
              exit 1
            fi
          done
          [ -n "${VERSIONS// /}" ] || { echo "::error::No version given."; exit 1; }
          if [ "$APPLY" = true ] && [ "$REF" != "$DEFAULT_REF" ]; then
            echo "::error::Only a dry run may run from $REF; apply from $DEFAULT_REF."
            exit 1
          fi
          if [ "$APPLY" = true ] && [ -z "$CONFIRM" ]; then
            echo "::error::apply needs the primary key fingerprint in confirm."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the public key is committed
        run: |
          if [ ! -s packaging/gpg.key ]; then
            echo "::error::packaging/gpg.key is missing."
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Every release's packages, each verified against that release's SHA256SUMS, which cosign
      # verifies against the release workflow's identity. This is the only source the RPM packages are
      # signed from; nothing in the bucket is trusted.
      - name: Download and verify the packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          set -euo pipefail
          mkdir verified
          for VERSION in $VERSIONS; do
            packages=(
              "hodeishield_${VERSION}-1_amd64.deb"
              "hodeishield_${VERSION}-1_arm64.deb"
              "hodeishield-${VERSION}-1.x86_64.rpm"
              "hodeishield-${VERSION}-1.aarch64.rpm"
            )
            rm -rf "rel-$VERSION"
            mkdir "rel-$VERSION"
            args=(-p SHA256SUMS -p SHA256SUMS.sigstore.json)
            for p in "${packages[@]}"; do args+=(-p "$p"); done
            gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D "rel-$VERSION" "${args[@]}"
            cosign verify-blob --bundle "rel-$VERSION/SHA256SUMS.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v${VERSION}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-trigger push "rel-$VERSION/SHA256SUMS"
            for p in "${packages[@]}"; do grep "  ${p}\$" "rel-$VERSION/SHA256SUMS"; done > "rel-$VERSION/packages.sums"
            (cd "rel-$VERSION" && sha256sum -c packages.sums)
            for p in "${packages[@]}"; do cp "rel-$VERSION/$p" verified/; done
          done
          ls verified

      - name: Build the repository image
        run: |
          set -euo pipefail
          . packaging/repo/image
          docker build --quiet --tag hodeishield-repo - <<EOF
          FROM $IMAGE
          RUN apt-get update -qq && apt-get install -y -qq --no-install-recommends $PACKAGES \
            && rm -rf /var/lib/apt/lists/*
          EOF

      # A throwaway keyring holding only the new signing subkey, removed at the end of the job.
      - name: Import the signing subkey
        id: key
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          SIGNING_KEY: ${{ secrets.PACKAGES_GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --quiet --import
          gpg --batch --quiet --import packaging/gpg.key
          fingerprints=$(gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "ssb" { sign = ($12 ~ /s/) } $1 == "fpr" && sign { print $10; sign = 0 }')
          if [ "$(printf '%s\n' "$fingerprints" | grep -c .)" != 1 ]; then
            echo "::error::PACKAGES_GPG_SIGNING_KEY must hold exactly one signing subkey."
            exit 1
          fi
          echo "signing_key=${fingerprints}!" >> "$GITHUB_OUTPUT"

      - name: Re-sign the RPM packages and rebuild the indexes
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          PACKAGES_S3_ENDPOINT: ${{ vars.PACKAGES_S3_ENDPOINT }}
          PACKAGES_S3_REGION: ${{ vars.PACKAGES_S3_REGION }}
          PACKAGES_S3_BUCKET: ${{ vars.PACKAGES_S3_BUCKET }}
          PACKAGES_S3_ACCESS_KEY_ID: ${{ secrets.PACKAGES_S3_ACCESS_KEY_ID }}
          PACKAGES_S3_SECRET_ACCESS_KEY: ${{ secrets.PACKAGES_S3_SECRET_ACCESS_KEY }}
          SIGNING_KEY: ${{ steps.key.outputs.signing_key }}
          APPLY: ${{ inputs.apply }}
          RESIGN_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          flag=()
          if [ "$APPLY" = true ]; then flag=(--apply); fi
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env PACKAGES_S3_ENDPOINT --env PACKAGES_S3_REGION --env PACKAGES_S3_BUCKET \
            --env PACKAGES_S3_ACCESS_KEY_ID --env PACKAGES_S3_SECRET_ACCESS_KEY \
            --env SIGNING_KEY --env RESIGN_CONFIRM --env GNUPGHOME=/gnupg --env PUBLIC_KEY=/gpg.key \
            --volume "$GNUPGHOME:/gnupg" \
            --volume "$PWD/packaging/gpg.key:/gpg.key:ro" \
            --volume "$PWD/packaging/repo:/repo:ro" \
            --volume "$PWD/verified:/new:ro" \
            hodeishield-repo sh /repo/resign.sh "${flag[@]}" /new

      - name: Remove the keyring
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          gpgconf --homedir "$GNUPGHOME" --kill all || true
          rm -rf "$GNUPGHOME"
