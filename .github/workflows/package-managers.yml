name: Package managers

# When a release is published (not while it is a draft, whose assets are not public yet), writes
# the Homebrew formula, the Scoop manifest and the winget manifests from that release's own
# SHA256SUMS, and publishes the first two to Hodeitek/homebrew-hodeishield and
# Hodeitek/scoop-hodeishield. The winget manifests are kept as an artifact: they are submitted to
# microsoft/winget-pkgs by hand (see CONTRIBUTING.md).
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: package-managers
  cancel-in-progress: false

jobs:
  manifests:
    name: write the manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the release version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$PRERELEASE" = true ]; then
            echo "::notice::$TAG is not a stable release; package managers are left as they are."
            exit 0
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.version.outputs.version != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # The manifests carry the hashes in SHA256SUMS, so check that file is the release workflow's.
      - name: Download and verify SHA256SUMS
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir rel
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D rel -p SHA256SUMS -p SHA256SUMS.sigstore.json
          cosign verify-blob --bundle rel/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v${VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-trigger push rel/SHA256SUMS

      # winget needs the MSI's product code, which changes with every version.
      - name: Read the MSI product code
        if: steps.version.outputs.version != ''
        id: msi
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          msi="hodeishield-${VERSION}-x86_64-pc-windows-msvc.msi"
          if ! grep -q "  ${msi}$" rel/SHA256SUMS; then
            echo "No MSI in this release; winget will use the zip."
            exit 0
          fi
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D rel -p "$msi"
          (cd rel && grep "  ${msi}$" SHA256SUMS | sha256sum -c -)
          sudo apt-get update -qq && sudo apt-get install -y -qq msitools > /dev/null
          code=$(msiinfo export "rel/$msi" Property | awk -F'\t' '$1 == "ProductCode" { print $2 }' | tr -d '\r')
          [[ "$code" =~ ^\{[0-9A-F-]{36}\}$ ]] || { echo "::error::unexpected ProductCode: $code"; exit 1; }
          echo "product_code=$code" >> "$GITHUB_OUTPUT"

      - name: Write the manifests
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRODUCT_CODE: ${{ steps.msi.outputs.product_code }}
        run: |
          set -euo pipefail
          python3 .github/scripts/package-manifests.py "$VERSION" rel/SHA256SUMS out ${PRODUCT_CODE:+"$PRODUCT_CODE"}
          find out -type f | sort

      - name: Upload the manifests
        if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-manifests
          path: out/
          if-no-files-found: error
          retention-days: 90

  # Publishes to the tap and the bucket with a short-lived token of the "HodeiShield packaging"
  # GitHub App, which is installed only on those two repositories with contents write. Its private
  # key lives in the `packaging` environment, whose reviewer approves this job. Skipped until the
  # App is set up (environment variable PACKAGING_APP_CLIENT_ID).
  publish:
    name: publish to Homebrew and Scoop
    needs: manifests
    if: needs.manifests.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: packaging
    permissions:
      contents: read
    steps:
      - name: Check the App is set up
        id: app
        env:
          CLIENT_ID: ${{ vars.PACKAGING_APP_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::notice::PACKAGING_APP_CLIENT_ID is not set in the packaging environment; nothing published."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the manifests
        if: steps.app.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-manifests
          path: out

      - name: Mint a token for the tap and the bucket
        if: steps.app.outputs.ready == 'true'
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PACKAGING_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGING_APP_PRIVATE_KEY }}
          owner: Hodeitek
          repositories: homebrew-hodeishield,scoop-hodeishield
          permission-contents: write

      # One commit per repository, made through the GraphQL API so GitHub signs it.
      - name: Commit the formula and the manifest
        if: steps.app.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ needs.manifests.outputs.version }}
        run: |
          set -euo pipefail
          commit() {
            repo="$1" src="$2" dest="$3"
            head=$(gh api "repos/Hodeitek/$repo/git/ref/heads/main" --jq .object.sha)
            python3 - "$repo" "$head" "$src" "$dest" > "$RUNNER_TEMP/commit.json" <<'EOF'
          import base64, json, os, sys
          repo, head, src, dest = sys.argv[1:]
          q = "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }"
          print(json.dumps({"query": q, "variables": {"input": {
              "branch": {"repositoryNameWithOwner": f"Hodeitek/{repo}", "branchName": "main"},
              "expectedHeadOid": head,
              "message": {"headline": f"hodeishield {os.environ['VERSION']}"},
              "fileChanges": {"additions": [{"path": dest, "contents": base64.b64encode(open(src, "rb").read()).decode()}]},
          }}}))
          EOF
            gh api graphql --input "$RUNNER_TEMP/commit.json" --jq '.data.createCommitOnBranch.commit.url'
          }
          commit homebrew-hodeishield out/homebrew/Formula/hodeishield.rb Formula/hodeishield.rb
          commit scoop-hodeishield out/scoop/bucket/hodeishield.json bucket/hodeishield.json
