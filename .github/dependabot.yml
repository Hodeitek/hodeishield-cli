version: 2
updates:
  # The root Cargo.toml is a workspace (api, cli, xtask) with a single root
  # Cargo.lock, so one entry at "/" covers every member.
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    # Wait a week after a new version is published before proposing it, so
    # newly released (and potentially malicious or unstable) versions age out.
    cooldown:
      default-days: 7
    # One PR per week for all minor and patch bumps instead of one per crate.
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Major bumps are never proposed automatically; they are done by hand.
    # This only affects version updates: security updates are configured
    # separately and still open PRs for vulnerable dependencies.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Same grouping and major-version policy as the cargo entry above.
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
