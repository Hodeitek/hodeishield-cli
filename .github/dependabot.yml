version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    # Wait a week after a new version is published before proposing it, so
    # newly released (and potentially malicious or unstable) versions age out.
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
