[workspace]
resolver = "3"
members = ["crates/hodeishield-api", "crates/hodeishield-cli", "xtask"]
default-members = ["crates/hodeishield-api", "crates/hodeishield-cli"]

[workspace.package]
authors = ["Hodeitek S.L. <info@hodeitek.com>"]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Hodeitek/hodeishield-cli"
homepage = "https://hodeishield.com"
documentation = "https://github.com/Hodeitek/hodeishield-cli#readme"
publish = false

[workspace.dependencies]
hodeishield-api = { path = "crates/hodeishield-api" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking", "json", "query", "form", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
